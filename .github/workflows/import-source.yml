name: Import latest application source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with uploaded source
        shell: bash
        run: |
          test -f rambutan-source.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name rambutan-source.zip -exec rm -rf {} +
          unzip -q rambutan-source.zip
          rm rambutan-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import cloud database application source"
          git push
